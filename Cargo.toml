[package]
name = "debtlens"
version = "0.1.0"
edition = "2024"
description = "Static technical debt analyzer"
license = "MIT"

[[bin]]
name = "dl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"