[package]
name = "debtlens"
version = "0.2.0"
edition = "2024"
description = "Static and semantic technical debt analyzer"
license = "MIT"

[[bin]]
name = "dl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dialoguer = "0.12"
dirs = "7"
ignore = "0.4"
indicatif = "0.18"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1"
tree-sitter = "0.27"
tree-sitter-javascript = "0.25"
base64 = "0.23.1"
minify-html = "0.18.1"

[build-dependencies]
base64 = "0.23.1"